<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        #1
    </style>
</head>
<body>
   <table style="border:10px groove rgb(205, 248, 255); border-collapse:separate; border-radius: 10%">
        <caption>Danh sách sản phẩm</caption>
        <tr>
            <th style="border:3px solid rgb(236, 206, 228)"; class="1">Tên sản phẩm</th>
            <th style="border:3px solid rgb(236, 206, 228)">Giá (VNĐ)</th>
            <th style="border:3px solid rgb(236, 206, 228)">Số lượng</th>
        </tr>
        <tr>
            <td>Áo thun</td>
            <td>150.000</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Quần jean</td>
            <td>350.000</td>
            <td>15</td>
        </tr>
   </table> 
   <table  border="1">
    <tr>
        <th rowspan="2">Học sinh</th>
        <th colspan="2">Điểm</th>
        <th rowspan="2">Trung bình</th>
    </tr>
    <tr>
        <th>Toán</th>
        <th>Văn</th>
    </tr>
    <tr>
        <td>An</td>
        <td>8</td>
        <td>9</td>
        <td>8.5</td>
    </tr>
    <tr>
        <td>Bình</td>
        <td>7</td>
        <td>8</td>
        <td>7.5</td>
    </tr>
   </table>
</body>
